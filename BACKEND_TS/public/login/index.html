<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BOND's Cineplex</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.png">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <!-- Logo Section -->
            <div class="brand-header">
                <div class="logo-icon"><i class="fa-solid fa-film"></i></div>
                <h1>BOND's Cineplex</h1>
                <p>Manage your theater experience</p>
            </div>

            <!-- Form Section -->
            <form id="login-form" method="post">                
                <div id="error-msg-top" class="error-message error-message-top"></div>

                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" name="username" placeholder="Username" autocomplete="off">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="Password">
                </div>

                <!-- Error Message Container -->
                <div id="error-msg" class="error-message"></div>

                <button type="button" id="login-btn">Login / Signup</button>
            </form>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
